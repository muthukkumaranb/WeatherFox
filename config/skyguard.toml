# SkyGuard AI configuration
# All paths are relative to the repo root.

[data]
raw_dir = "data/raw"
clean_dir = "data/clean"
registry_path = "data/station_registry.csv"

[split]
# Deterministic split by hash of station_id with a fixed salt.
# Three DISJOINT station groups:
#   - train stations (~70%)       → year 2023 only
#   - validation stations (15%)   → year 2023 only (held-out stations)
#   - test = ALL stations in 2024 (time hold-out)
#            PLUS the 15% unseen test stations in 2023 (station hold-out)
# The test split is locked and never tuned on.
train_year = 2023
val_station_fraction = 0.15
test_years = [2024]
test_unseen_station_fraction = 0.15
station_hash_salt = "skyguard_split_v1"

[paths]
splits_dir = "splits"
reports_dir = "reports"
models_dir = "models"

[detector]
history_hours = 24
max_neighbours = 10
max_neighbour_km = 200.0
metar_rounding_tolerance_C = 1.0

[rule_gate]
# Assumptions: rule gate thresholds to be tuned on validation data.
T_min = -40.0
T_max = 60.0
RH_min = 0.0
RH_max = 103.0
P_min = 600.0
P_max = 1100.0
frozen_hours = 6.0
frozen_hours_integer = 12.0
min_frozen_readings = 3
fog_rh_threshold = 97.0
fog_td_diff_max = 0.5
td_max_above_t = 0.2

[rule_gate.step]
# Step limit thresholds per cadence (in minutes). Use nearest cadence at or above actual cadence.
c1   = { T = 3.0, RH = 10.0, P = 0.5 }
c15  = { T = 5.0, RH = 20.0, P = 1.5 }
c30  = { T = 6.0, RH = 25.0, P = 2.0 }
c60  = { T = 8.0, RH = 30.0, P = 3.0 }
c180 = { T = 12.0, RH = 40.0, P = 6.0 }

[conformal]
# Two-tier thresholds for anomaly vs uncertain labels.
alpha_anomaly = 0.001
alpha_uncertain = 0.01

[health]
cusum_threshold = 5.0

[replay]
buffer_max_rows = 200
speed_factor = 3600.0

[api]
host = "0.0.0.0"
port = 8000

[genuine_events]
# Format: one [[genuine_events.events]] table per event with keys:
#   name, type, start, end, lat_min, lat_max, lon_min, lon_max
[[genuine_events.events]]
name = "NW India Heat Wave May 2024"
type = "heat_wave"
start = "2024-05-18T00:00:00Z"
end = "2024-05-31T23:59:59Z"
lat_min = 20.0
lat_max = 35.0
lon_min = 70.0
lon_max = 85.0

[harness]
max_incident_hours = 24.0
max_gap_hours = 1.0
alert_budget = 0.05

