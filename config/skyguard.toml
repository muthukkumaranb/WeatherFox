# SkyGuard AI configuration
# All paths are relative to the repo root.

[data]
raw_dir = "data/raw"
clean_dir = "data/clean"
registry_path = "data/station_registry.csv"

[split]
test_time_start = "2024-07-01T00:00:00Z"
val_time_start = "2024-04-01T00:00:00Z"
station_hash_seed = 42

[detector]
history_hours = 24
max_neighbours = 10
max_neighbour_km = 200.0
metar_rounding_tolerance_C = 1.0

[conformal]
alpha = 0.05

[health]
cusum_threshold = 5.0

[replay]
buffer_max_rows = 200

[api]
host = "0.0.0.0"
port = 8000

